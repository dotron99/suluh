[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "suluh"
version = "0.1.0"
description = "Suluh: a local-first, agent-ready literature library with an MCP server for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mohamad Izani Zainal Abidin" }]
keywords = ["literature-review", "reference-manager", "mcp", "claude-code", "research-tools", "open-science"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "httpx>=0.25",
  "pypdf>=4.0",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "respx>=0.21"]

[project.scripts]
suluh = "suluh.cli:main"

[project.urls]
Homepage = "https://github.com/dotron99/suluh"
Issues = "https://github.com/dotron99/suluh/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
